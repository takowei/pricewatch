# Static file server for the built SPA (bun run build -> dist/). Serves
# ONLY the build output — no directory listing, no source, no dev tooling.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Static assets: exact file or 404. Never fall through to a directory
    # listing or to index.html for a missing asset.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA routes: serve the matching file if it exists, otherwise fall back
    # to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Belt-and-braces: never serve dotfiles (e.g. a stray .env if one ever
    # ends up in the build context) or anything outside webroot.
    location ~ /\. {
        deny all;
    }
}
